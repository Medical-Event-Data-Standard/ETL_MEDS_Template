[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ETL-MEDS"
dynamic = ["version"]
authors = [
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
]
description = "A template ETL pipeline to extract arbitrary data into the MEDS format."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# `~=0.6` means `>=0.6, <1.0`, not `>=0.6, <0.7` -- the compatible-release operator only
# pins to the last component given, so a bare `~=0.6` admits every 0.x. That would let the
# imminent MEDS-Extract 0.7.0 install here unvetted, and 0.7 is a breaking redesign (MESSY
# configs, renamed stages, a new runner CLI). Capped explicitly rather than with `~=0.6.0`
# so the intent is legible at a glance; raise it deliberately when the template is migrated.
dependencies = [
  "MEDS-extract>=0.6,<0.7", "requests", "beautifulsoup4"
]

[dependency-groups]
dev = ["pre-commit<4"]
tests = ["pytest", "pytest-cov"]

[tool.setuptools_scm]

[project.optional-dependencies]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

[project.scripts]
MEDS_extract-sample_dataset = "ETL_MEDS.__main__:main"

[project.urls]
Homepage = "https://github.com/Medical-Event-Data-Standard/ETL_MEDS_Template"
Issues = "https://github.com/Medical-Event-Data-Standard/ETL_MEDS_Template/issues"
