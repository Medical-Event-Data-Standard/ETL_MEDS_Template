[project]
name = "ETL-MEDS-Template"
version = "0.0.0"
description = "Copier template for config-only MEDS-Extract dataset ETL packages (development harness; not published)."
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pre-commit<4",
  "copier>=9.4",
  "pytest",
  "pytest-copie",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--color=yes"]
