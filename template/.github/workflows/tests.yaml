name: Tests

# The spec runs end to end over the toy input of tests/conftest.py, plain and with the suMEDS
# enrichment stage against a tiny local ontology source (no network), and suMEDS's contract tests
# check the rules and the enrichment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup package
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ -v
